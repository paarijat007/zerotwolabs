<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTwoLab — Own Your Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafaf9;
            color: #1c1917;
        }
        .serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .fade-in {
            animation: fadeIn 2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        .divider {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, #d6d3d1, transparent);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div class="grain"></div>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-24 text-center max-w-3xl mx-auto">
        
        <!-- Logo -->
        <div class="mb-12 fade-in">
            <span class="serif text-2xl tracking-widest text-stone-400 font-light">ZEROTWOLAB</span>
        </div>

        <!-- Hero -->
        <h1 class="serif text-5xl md:text-7xl font-light leading-tight mb-8 fade-in" style="animation-delay: 0.2s">
            The age of <br>
            <span class="italic text-stone-500">rented intelligence</span><br>
            is ending.
        </h1>

        <div class="divider my-8 fade-in" style="animation-delay: 0.4s"></div>

        <!-- Manifesto -->
        <p class="text-lg md:text-xl leading-relaxed text-stone-600 font-light max-w-2xl mb-6 fade-in" style="animation-delay: 0.6s">
            Open models. Your data. Your infrastructure.<br>
            No subscriptions. No gatekeepers. No black boxes.
        </p>

        <p class="text-stone-400 text-sm fade-in" style="animation-delay: 0.8s">
            Coming soon.
        </p>

        <!-- Email Capture -->
        <div class="mt-16 w-full max-w-md fade-in" style="animation-delay: 1s">
            <form class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="email" 
                    placeholder="your@email.com" 
                    class="flex-1 px-4 py-3 bg-white border border-stone-200 rounded-none focus:outline-none focus:border-stone-400 text-sm placeholder:text-stone-300"
                >
                <button 
                    type="submit" 
                    class="px-6 py-3 bg-stone-800 text-stone-50 text-sm hover:bg-stone-700 transition-colors duration-300"
                >
                    Notify me
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-8 text-center text-stone-400 text-xs tracking-wider">
        <span class="serif italic">Own your model. Own your data. Own your future.</span>
    </footer>

</body>
</html>
